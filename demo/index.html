  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#bz-main *{box-sizing:border-box} #bz-main button,#bz-main a{-webkit-tap-highlight-color:transparent} #bz-main button{font:inherit} #bz-main a{color:inherit;text-decoration:none} #bz-main button:focus-visible,#bz-main a:focus-visible{outline:3px solid #b2350c;outline-offset:4px} #bz-main .page{min-height:1450px;background:#fff;--bz-radius:28px} #bz-main h1,#bz-main h2,#bz-main h3,#bz-main p{margin:0} #bz-main h1{font-size:clamp(38px,5.3vw,60px);line-height:1.06;font-weight:700;letter-spacing:-.055em} #bz-main h2{font-size:32px;line-height:1.15;font-weight:650;letter-spacing:-.04em} #bz-main h3{font-size:21px;font-weight:650;line-height:1.2;letter-spacing:-.03em} #bz-main p{font-size:14px;line-height:1.65} #bz-main .copy{color:#666461;max-width:355px} #bz-main .eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase} #bz-main .top{height:86px;display:flex;align-items:center;gap:32px;padding:0 4.3%} #bz-main .brand{width:125px;display:block;flex:none} #bz-main .brand img{width:100%;display:block} #bz-main .nav{display:flex;gap:24px;font-size:12px;font-weight:600;flex:1;justify-content:center} #bz-main .login{font-size:12px;border:1px solid #e1dfdb;background:white;border-radius:99px;padding:11px 17px} #bz-main .menu{display:none;border:0;background:transparent;margin-left:auto;padding:10px} #bz-main .cta{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:48px;padding:14px 21px;border:0;border-radius:14px;background:var(--bz-orange);color:white;font-size:13px;font-weight:700;box-shadow:0 5px 14px #d4441214;transition:transform .18s,box-shadow .18s} #bz-main .cta:hover{transform:translateY(-2px);box-shadow:0 9px 20px #ce451b28} #bz-main .cta.secondary{background:#fff;color:#262422;box-shadow:inset 0 0 0 1px #e1ddd7} #bz-main .cta.dark{background:#252423;color:#fff} #bz-main .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} #bz-main .textlink{font-size:12px;font-weight:700;display:inline-flex;align-i etails class=&quot;project-details&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Подробнее о проекте&lt;/summary&gt;&lt;p&gt;Шкаф для организованного хранения. Подберите размеры, внешний вид и внутреннее наполнение под свои вещи и пространство.&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;project-actions&quot;&gt;&lt;button class=&quot;cta cursor-interaction&quot; data-open&gt;Изменить под себя ↗&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
&lt;/div&gt;&lt;p class=&quot;price-disclaimer&quot;&gt;Проекты и цены в этом макете приведены для примера. Финальную стоимость и возможность изготовления подтверждает технолог.&lt;/p&gt;&lt;div class=&quot;catalog-more&quot;&gt;&lt;button class=&quot;cta secondary cursor-interaction&quot; data-notice=&quot;catalog&quot;&gt;Весь каталог мебели &lt;i class=&quot;icon&quot; data-lucide=&quot;arrow-up-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;flow-section&quot; data-how&gt;&lt;div class=&quot;row&quot;&gt;&lt;h2&gt;От идеи до мебели.&lt;br&gt;Понятно на каждом этапе.&lt;/h2&gt;&lt;p class=&quot;copy&quot;&gt;Начать можно онлайн. А важные решения мы согласуем с вами.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;flow-steps&quot;&gt;&lt;article class=&quot;flow-step&quot;&gt;&lt;span class=&quot;step-no&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Выберите основу&lt;/h3&gt;&lt;p&gt;Найдите кухню или шкаф в каталоге проектов.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;flow-step&quot;&gt;&lt;span class=&quot;step-no&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Настройте под себя&lt;/h3&gt;&lt;p&gt;Измените параметры и посмотрите предварительную стоимость.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;flow-step&quot;&gt;&lt;span class=&quot;step-no&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Оставьте заявку&lt;/h3&gt;&lt;p&gt;Отправьте проект и контакты. Регистрация для заявки не нужна.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;flow-step&quot;&gt;&lt;span class=&quot;step-no&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Согласуйте детали&lt;/h3&gt;&lt;p&gt;Технолог проверит проект и подтвердит цену и условия.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;flow-step&quot;&gt;&lt;span class=&quot;step-no&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Закажите изготовление&lt;/h3&gt;&lt;p&gt;После согласования — производство и организация установки.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section data-about&gt;&lt;div class=&quot;blockhead&quot;&gt;&lt;h2&gt;Больше ясности.&lt;br&gt;Меньше неопределённости.&lt;/h2&gt;&lt;p class=&quot;copy&quot;&gt;Вы видите, из чего складывается проект и что произойдёт дальше.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;trust-grid&quot;&gt;&lt;article class=&quot;trust-price&quot;&gt;&lt;span class=&quot;trust-tag&quot;&gt;Стоимость на этапе выбора&lt;/span&gt;&lt;h3&gt;Сначала настройте.&lt;br&gt;Потом решайте.&lt;/h3&gt;&lt;p&gt;Посмотрите предварительную стоимость выбранной комплектации. Сравните материалы и параметры, прежде чем отправить заявку.&lt;/p&gt;&lt;div class=&quot;price-art&quot;&gt;&lt;span&gt;Размеры&lt;/span&gt;&lt;span&gt;Материалы&lt;/span&gt;&lt;span&gt;Фурнитура&lt;/span&gt;&lt;span&gt;Наполнение&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;trust-tech&quot;&gt;&lt;span class=&quot;trust-tag&quot;&gt;До запуска в производство&lt;/span&gt;&lt;h3&gt;Ваш проект проверит&lt;br&gt;технолог.&lt;/h3&gt;&lt;p&gt;Специалист проверит размеры, конфигурацию и возможность изготовления. Если нужны изменения, команда объяснит их и согласует с вами.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;&lt;span&gt;Проверка проекта&lt;/span&gt;&lt;span&gt;Финальная цена&lt;/span&gt;&lt;span&gt;Согласование&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;trust-after&quot;&gt;&lt;div class=&quot;seal&quot;&gt;&lt;i class=&quot;icon&quot; data-lucide=&quot;clipboard-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Условия — после проверки, решение — за вами&lt;/h3&gt;&lt;p&gt;Финальные параметры и стоимость подтверждаются до передачи согласованного проекта в производство. После регистрации этапы заявки и заказа доступны в кабинете.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;p class=&quot;install-preview-note&quot;&gt;Фото, имена, рейтинги и отзывы — демонстрационные. На работающем сайте здесь будут реальные данные установщиков.&lt;/p&gt;
&lt;/section&gt;
&lt;section data-faq&gt;&lt;div class=&quot;blockhead&quot;&gt;&lt;h2&gt;Перед первым шагом&lt;br&gt;обычно спрашивают.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;faq-layout&quot;&gt;&lt;div class=&quot;faq-list&quot;&gt;&lt;details data-faq-item=&quot;measure&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Нужны ли точные размеры для начала?&lt;/summary&gt;&lt;p&gt;Для знакомства с проектами можно начать с ориентировочных размеров. Перед изготовлением данные должны быть уточнены и проверены: не отправляйте в производство проект, основанный только на приблизительных замерах.&lt;/p&gt;&lt;/details&gt;&lt;details data-faq-item=&quot;change&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Что можно изменить в готовом проекте?&lt;/summary&gt;&lt;p&gt;Размеры, материалы корпуса и фасадов, фурнитуру и наполнение — в пределах возможностей выбранного проекта. Доступные изменения будут показаны в конструкторе.&lt;/p&gt;&lt;/details&gt;&lt;details data-faq-item=&quot;price&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Цена в конструкторе окончательная?&lt;/summary&gt;&lt;p&gt;Нет. Это предварительная стоимость выбранной конфигурации. Финальную цену и возможность изготовления подтверждают после проверки проекта технологом. Причины изменений объясняются и согласуются с вами.&lt;/p&gt;&lt;/details&gt;&lt;details data-faq-item=&quot;account&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Нужно ли регистрироваться, чтобы оставить заявку?&lt;/summary&gt;&lt;p&gt;Нет. Вы можете выбрать проект, настроить его и отправить заявку с контактами без обязательной регистрации. После отправки можно создать кабинет для отслеживания заявки и заказа.&lt;/p&gt;&lt;/details&gt;&lt;details data-faq-item=&quot;install&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Как выбрать специалиста по установке?&lt;/summary&gt;&lt;p&gt;На платформе будет список заранее отобранных установщиков. Выбор сохраняется в заявке или заказе. Доступность специалиста и условия установки уточняются отдельно.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;aside class=&quot;knowledge&quot;&gt;&lt;span class=&quot;eyebrow&quot;&gt;Полезные материалы&lt;/span&gt;&lt;h3&gt;Разобраться&lt;br&gt;помогут подсказки.&lt;/h3&gt;&lt;a href=&quot;#&quot; data-guide=&quot;measure&quot;&gt;Как подготовить размеры →&lt;/a&gt;&lt;a href=&quot;#&quot; data-guide=&quot;price&quot;&gt;Как устроена стоимость →&lt;/a&gt;&lt;a href=&quot;#&quot; data-guide=&quot;account&quot;&gt;Что будет после заявки →&lt;/a&gt;&lt;p class=&quot;caption&quot;&gt;Короткие ответы на вопросы о выборе, проектировании и заказе мебели.&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;contact-section&quot; data-contact&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Помощь с проектом&lt;/span&gt;&lt;h2&gt;Есть идея.&lt;br&gt;Нужна поддержка?&lt;/h2&gt;&lt;p class=&quot;copy&quot;&gt;Расскажите, какую мебель хотите. Команда поможет определить следующий шаг: выбрать готовый проект или обсудить индивидуальное проектирование.&lt;/p&gt;&lt;div class=&quot;no-account&quot;&gt;&lt;i class=&quot;icon&quot; data-lucide=&quot;user-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Заявка без регистрации&lt;/div&gt;&lt;/div&gt;&lt;form class=&quot;contact-form&quot;&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Как к вам обращаться&lt;input name=&quot;name&quot; placeholder=&quot;Ваше имя&quot; autocomplete=&quot;given-name&quot;&gt;&lt;/label&gt;&lt;label&gt;Телефон для связи&lt;input name=&quot;phone&quot; type=&quot;tel&quot; placeholder=&quot;+7 ___ ___-__-__&quot; autocomplete=&quot;tel&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;fullfield&quot;&gt;Что хотите спроектировать?&lt;select name=&quot;furniture&quot;&gt;&lt;option&gt;Кухню&lt;/option&gt;&lt;option&gt;Шкаф&lt;/option&gt;&lt;option&gt;Помогите определиться&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;fullfield&quot;&gt;Коротко о задаче&lt;textarea name=&quot;message&quot; placeholder=&quot;Размеры, пожелания, вопросы — если уже знаете&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;/div&gt;&lt;label class=&quot;consent&quot;&gt;&lt;input type=&quot;checkbox&quot; required&gt;&lt;span&gt;Согласен на обработку персональных данных. &lt;a href=&quot;#&quot; data-notice=&quot;privacy&quot;&gt;Политика конфиденциальности&lt;/a&gt;&lt;/span&gt;&lt;/label&gt;&lt;button class=&quot;cta cursor-interaction&quot; type=&quot;submit&quot;&gt;Обсудить проект &lt;i class=&quot;icon&quot; data-lucide=&quot;arrow-up-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;div class=&quot;form-result&quot; data-form-result hidden role=&quot;status&quot;&gt;&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;

    if (roots.has(root)) return;

      for (const { addedNodes } of records) {

        }

      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });

  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();

    tooltip = null;
  };
